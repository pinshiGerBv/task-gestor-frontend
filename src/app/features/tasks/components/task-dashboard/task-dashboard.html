<div id="dash">
  <b>Dashboard</b>
  <br><br> 

  <div class="container">
    <svg viewBox="0 0 120 120" width="150" height="150">
      <circle class="bg" cx="60" cy="60" r="45"></circle>
      <circle #progressCircle class="progress" id="progress-1" cx="60" cy="60" r="45"></circle>
      <text x="50%" y="50%" text-anchor="middle" font-size="30" fill="black">{{ maxPending }}</text>
      <text x="50%" y="60%" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="blue">
        Pending
      </text>
    </svg>

    <svg viewBox="0 0 120 120" width="150" height="150">
      <circle class="bg" cx="60" cy="60" r="45"></circle>
      <circle #progressCircle class="progress" id="progress-2" cx="60" cy="60" r="45"></circle>
      <text x="50%" y="50%" text-anchor="middle" font-size="30" fill="black">{{ maxInp }}</text>
      <text x="50%" y="60%" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="rgb(245,157,80)">
        In-progress
      </text>
    </svg>

    <svg viewBox="0 0 120 120" width="150" height="150">
      <circle class="bg" cx="60" cy="60" r="45"></circle>
      <circle #progressCircle class="progress" id="progress-3" cx="60" cy="60" r="45"></circle>
      <text x="50%" y="50%" text-anchor="middle" font-size="30" fill="black">{{ maxCompleted }}</text>
      <text x="50%" y="60%" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="rgb(94,196,156)">
        Completed
      </text>
    </svg>
  </div>

  <br>

  <div class="container">

    <div class="container-op">
      <div id="search">
        <i class="fas fa-search"></i>
        <input 
          type="text" 
          placeholder="Search by title..."
          [(ngModel)]="searchTerm"
          (input)="searchTasks()">
      </div>
    </div>

    <div class="container-op">
      <h4>Status</h4>
      <div class="container">
        <button 
          class="filter" 
          [class.active]="activeStatusFilter === 'all'"
          (click)="resetFilters()">
          All
        </button>

        <button 
          class="filter" 
          [class.active]="activeStatusFilter === 'pending'"
          (click)="filterByStatus('pending')">
          Pending
        </button>

        <button 
          class="filter" 
          [class.active]="activeStatusFilter === 'in-progress'"
          (click)="filterByStatus('in-progress')">
          In Progress
        </button>

        <button 
          class="filter" 
          [class.active]="activeStatusFilter === 'completed'"
          (click)="filterByStatus('completed')">
          Completed
        </button>
      </div>
    </div>

    <div class="container-op">
      <h4>Priority</h4>
      <div class="container">
        <button 
          class="filter" 
          [class.active]="activePriorityFilter === 'all'"
          (click)="filterByPriority('all')">
          All
        </button>

        <button 
          class="filter" 
          [class.active]="activePriorityFilter === 'low'"
          (click)="filterByPriority('low')">
          Low
        </button>

        <button 
          class="filter" 
          [class.active]="activePriorityFilter === 'medium'"
          (click)="filterByPriority('medium')">
          Medium
        </button>

        <button 
          class="filter" 
          [class.active]="activePriorityFilter === 'high'"
          (click)="filterByPriority('high')">
          High
        </button>
      </div>
    </div>
  </div>

  <br>

  <app-task-list [tasks]="tasks"></app-task-list>

  <div style="text-align: end;">  
    <button (click)="transformDisplay()">Add New Task</button>
  </div>
</div>
